name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libxkbcommon for the XKB test
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxkbcommon0 xkb-data
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Results are up to date
        run: |
          python -m kbeval
          python -m kbeval --corpus data/it_wikipedia_top20000.csv --out results/wikipedia
          python -m kbeval.compare subtitles=results wikipedia=results/wikipedia --out results
          python -m kbeval.export
          git diff --exit-code results/ dist/
          test -z "$(git status --porcelain results/ dist/)"
